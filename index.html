<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PayPay</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --red: #ff0033;
      --red-dark: #cc0029;
      --blue: #00adeb;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --text-muted: #999999;
      --border: #e5e5e5;
      --bg: #f5f5f5;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      background: #fff;
    }

    /* Header */
    .header {
      height: 52px;
      background: #fff;
      display: flex;
      align-items: center;
      padding: 0 16px;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 700;
      color: var(--red);
      letter-spacing: -0.3px;
    }

    /* Main content */
    .main {
      flex: 1;
      padding: 24px 16px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Sender card */
    .sender-card {
      width: 100%;
      background: #fff;
      border-radius: 16px;
      padding: 28px 20px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      margin-bottom: 16px;
    }

    .avatar-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff4d6d 0%, #ff0033 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
    }

    .paypay-badge {
      position: absolute;
      bottom: -2px;
      right: -2px;
      width: 24px;
      height: 24px;
      background: var(--red);
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .paypay-badge svg {
      width: 14px;
      height: 14px;
    }

    .sender-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
      text-align: center;
    }

    .sender-id {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 20px;
    }

    .request-label {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .amount-wrap {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 6px;
    }

    .currency-symbol {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .amount {
      font-size: 44px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -1px;
      line-height: 1;
    }

    .message-box {
      width: 100%;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 12px 14px;
      margin-top: 16px;
      text-align: left;
    }

    .message-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .message-text {
      font-size: 14px;
      color: var(--text-primary);
      line-height: 1.5;
    }

    /* Expiry notice */
    .expiry-notice {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      background: #fff8e1;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .expiry-icon {
      font-size: 16px;
      flex-shrink: 0;
    }

    .expiry-text {
      font-size: 12px;
      color: #795548;
    }

    /* CTA button */
    .btn-pay {
      width: 100%;
      height: 54px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 27px;
      font-size: 17px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 12px;
      transition: background 0.15s;
      box-shadow: 0 4px 14px rgba(255,0,51,0.35);
    }

    .btn-pay:active {
      background: var(--red-dark);
    }

    .btn-pay-icon {
      width: 22px;
      height: 22px;
    }

    .btn-app {
      width: 100%;
      height: 48px;
      background: #fff;
      color: var(--text-secondary);
      border: 1.5px solid var(--border);
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .btn-app:active {
      background: #f5f5f5;
    }

    /* Info section */
    .info-section {
      width: 100%;
      margin-top: 24px;
      padding: 0 4px;
    }

    .info-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 12px;
    }

    .info-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .info-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .info-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--blue);
      margin-top: 6px;
      flex-shrink: 0;
    }

    /* Footer */
    .footer {
      padding: 20px 16px;
      text-align: center;
      border-top: 1px solid var(--border);
    }

    .footer-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      margin-bottom: 8px;
    }

    .footer-logo-icon {
      width: 20px;
      height: 20px;
    }

    .footer-logo-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--red);
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 8px;
    }

    .footer-link {
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer-copyright {
      font-size: 11px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Header -->
    <header class="header">
      <a class="header-logo" href="#">
        <svg class="logo-icon" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="#FF0033"/>
          <path d="M12 28V14h6.5c3.6 0 6.5 2.1 6.5 5.2 0 3.1-2.9 5.2-6.5 5.2H16V28H12zm4-7.4h2.4c1.6 0 2.7-.9 2.7-2.4 0-1.5-1.1-2.4-2.7-2.4H16v4.8z" fill="white"/>
          <path d="M25 22.5c0-3.3 2.7-5.5 6-5.5v3c-1.7 0-2.9 1.1-2.9 2.5S29.3 25 31 25v3c-3.3 0-6-2.2-6-5.5z" fill="white"/>
        </svg>
        <span class="logo-text">PayPay</span>
      </a>
    </header>

    <!-- Main -->
    <main class="main">

      <!-- Sender card -->
      <div class="sender-card">
        <div class="avatar-wrap">
          <div class="avatar">な</div>
          <div class="paypay-badge">
            <svg viewBox="0 0 14 14" fill="white">
              <path d="M3 10V5h2.5c1.4 0 2.5.8 2.5 2s-1.1 2-2.5 2H4.5V10H3zm1.5-2.8h.9c.6 0 1-.3 1-.9s-.4-.9-1-.9h-.9v1.8z"/>
              <path d="M9.5 8.2c0-1.3 1-2.1 2.3-2.1v1.2c-.7 0-1.1.4-1.1 1s.4 1 1.1 1v1.2c-1.3 0-2.3-.9-2.3-2.3z"/>
            </svg>
          </div>
        </div>

        <div class="sender-name">中村 菜月</div>
        <div class="sender-id">@natsuki_n</div>

        <div class="divider"></div>

        <div class="request-label">送金リクエスト</div>
        <div class="amount-wrap">
          <span class="currency-symbol">¥</span>
          <span class="amount">3,000</span>
        </div>

        <div class="message-box">
          <div class="message-label">メッセージ</div>
          <div class="message-text">先日の飲み代、よろしく！</div>
        </div>
      </div>

      <!-- Expiry -->
      <div class="expiry-notice">
        <span class="expiry-icon">⏰</span>
        <span class="expiry-text">このリンクは作成から14日間有効です</span>
      </div>

      <!-- Buttons -->
      <button class="btn-pay">
        <svg class="btn-pay-icon" viewBox="0 0 22 22" fill="white">
          <rect width="22" height="22" rx="5" fill="white" fill-opacity="0.25"/>
          <path d="M5 14V9h3c1.7 0 3 1 3 2.5S9.7 14 8 14H6.5v2.5H5V14zm1.5-2.3h1.1c.7 0 1.2-.4 1.2-1.1 0-.7-.5-1.1-1.2-1.1H6.5v2.2z" fill="white"/>
          <path d="M12.5 12.8c0-1.5 1.2-2.5 2.7-2.5v1.4c-.8 0-1.3.5-1.3 1.1s.5 1.1 1.3 1.1v1.4c-1.5 0-2.7-1-2.7-2.5z" fill="white"/>
        </svg>
        PayPayで送る
      </button>

      <button class="btn-app">アプリを持っていない方はこちら</button>

      <!-- Info -->
      <div class="info-section">
        <p class="info-title">ご利用について</p>
        <ul class="info-list">
          <li class="info-item">
            <span class="info-dot"></span>
            <span>送金にはPayPayアプリへのログインが必要です。</span>
          </li>
          <li class="info-item">
            <span class="info-dot"></span>
            <span>送金額はリクエスト金額と異なる金額を送ることもできます。</span>
          </li>
          <li class="info-item">
            <span class="info-dot"></span>
            <span>このリンクからの送金は一度のみ有効です。</span>
          </li>
          <li class="info-item">
            <span class="info-dot"></span>
            <span>PayPayの残高・PayPayクレジット（旧あと払い）からお支払いいただけます。</span>
          </li>
        </ul>
      </div>

    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-logo">
        <svg class="footer-logo-icon" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="8" fill="#FF0033"/>
          <path d="M10 25V14h5c2.8 0 5 1.6 5 4s-2.2 4-5 4h-2v3h-3zm3-5.6h1.8c1.2 0 2-.7 2-1.8 0-1.1-.8-1.8-2-1.8H13v3.6z" fill="white"/>
          <path d="M22 20.4c0-2.5 2-4.2 4.5-4.2v2.3c-1.3 0-2.1.8-2.1 1.9s.8 1.9 2.1 1.9v2.3c-2.5 0-4.5-1.7-4.5-4.2z" fill="white"/>
        </svg>
        <span class="footer-logo-text">PayPay</span>
      </div>
      <div class="footer-links">
        <a class="footer-link" href="#">利用規約</a>
        <a class="footer-link" href="#">プライバシーポリシー</a>
        <a class="footer-link" href="#">ヘルプ</a>
      </div>
      <p class="footer-copyright">© PayPay Corporation</p>
    </footer>

  </div>
</body>
</html>
