<!DOCTYPE html>
<html lang="ja">
<head>

  <title>PayPay</title>
  <link rel="icon" href="https://cdn.assets.paypay.ne.jp/cdn/apps/prod/web/5-72-0/favicon.ico">
  <script src="https://cdn.assets.paypay.ne.jp/cdn/libs/@dotlottie/player-component/dotlottie-player.mjs" async type="module"></script>
  <style>
    @font-face{font-family:Graphik;font-display:swap;font-weight:300;src:url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:400;src:url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:600;src:url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:700;src:url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff)format("woff")}

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: Graphik, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans", "Noto Sans CJK JP", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      font-size: 12px;
    }
    body {
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background: linear-gradient(160deg, #f5b942 0%, #e8873a 40%, #c95e2a 100%);
    }
    a { text-decoration: none; }
    button { border: 0; outline: 0; cursor: pointer; font-family: inherit; }

    /* Background animation (fixed, behind everything) */
    .background-animation-wrapper {
      z-index: -1; width: 100%; max-width: 420px; margin: 0;
      position: fixed; top: 0; left: 50%; transform: translate(-50%);
    }

    /* Title bar */
    .title-bar { text-align: left; background: #fff; width: 100%; }
    .title-bar img { width: 100px; padding: 16px; display: block; }

    /* Page layout */
    .p2p-page { background: transparent; flex-direction: column; justify-content: flex-start; min-height: 100vh; display: flex; }
    .p2p-content { flex-direction: column; justify-content: center; align-items: center; display: flex; }

    /* Profile */
    .p2p-profile { color: #fff; flex-direction: column; justify-content: center; align-items: center; margin: 24px; display: flex; font-weight: 600; }
    .p2p-profile .p2p-profile-img { border: 2px solid #fff; border-radius: 50%; width: 60px; height: 60px; margin-bottom: 8px; display: block; }
    .p2p-profile .p2p-profile-details { color: #fff; margin-bottom: 8px; font-size: 14px; line-height: 22px; }
    .p2p-profile .payment-date { font-size: 12px; line-height: 18px; color: #fff; }

    /* Amount */
    .p2p-amount { color: #fff; display: flex; align-items: baseline; }
    .p2p-amount .amount-number { font-size: 60px; line-height: 68px; }
    .p2p-amount .amount-currency { font-size: 30px; line-height: 38px; }

    /* Main details */
    .p2p-main-details {
      flex-direction: column; justify-content: space-between; align-items: center;
      height: 264px; margin-bottom: 24px; display: flex;
    }
    .message-wrapper { }
    .status-details { text-align: center; }
    .status {
      color: #fff; border: 2px solid #fff; border-radius: 16px;
      margin-bottom: 16px; padding: 2px 12px;
      font-size: 16px; font-weight: 600; line-height: 24px; display: inline-block;
    }
    .display-date { color: #fff; font-size: 14px; line-height: 22px; font-weight: 600; }
    .display-label { margin-right: 5px; }

    /* Action buttons */
    .p2p-actions {
      flex-direction: column; justify-content: center;
      width: calc(100% - 32px); max-width: 380px; margin: 0 auto 40px; display: flex;
    }
    .action-btns { flex-direction: column; display: flex; }
    .p2p-btn {
      text-align: center; color: #fff; background: transparent;
      border: 2px solid #fff; border-radius: 8px; padding: 11px 0;
      font-size: 14px; line-height: 22px; font-weight: 600;
      cursor: pointer; display: block; width: 100%;
    }
    .p2p-btn.primary { background-color: #3895ff; margin-bottom: 16px; }

    /* Transaction card */
    .p2p-card {
      text-align: left; border-top: 0.5px solid rgba(255,255,255,0.5);
      max-width: 380px; margin: 0 auto 16px; padding: 16px 0; width: calc(100% - 32px);
    }
    .p2p-transact { color: #fff; background-color: rgba(0,0,0,0.16); border-radius: 8px; padding: 16px; }
    .each-row { justify-content: space-between; align-items: flex-end; margin-bottom: 8px; display: flex; }
    .label { color: #fff; font-size: 12px; line-height: 14px; }
    .value { color: #fff; font-size: 12px; font-weight: 600; line-height: 18px; }
    .id { align-items: center; }
    .id .copy-icon { width: 16px; height: 17px; margin-left: 4px; }
    .declaration { padding-top: 12px; color: rgba(255,255,255,0.7); font-size: 10px; line-height: 14px; }
    .container { max-width: 100vw; margin: 0 auto; }
    .open-animation-wrapper { display: none; }
  </style>
</head>
