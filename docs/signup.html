<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,height=device-height,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover">
  <title>PayPay - 新規登録</title>
  <link rel="icon" href="https://cdn.assets.paypay.ne.jp/cdn/apps/prod/web/5-72-0/favicon.ico">
  <style>
    @font-face{font-family:Graphik;font-display:swap;font-weight:300;src:url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:400;src:url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:600;src:url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:700;src:url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff)format("woff")}

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: Graphik, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans", "Noto Sans CJK JP", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      font-size: 12px;
      background-color: #fff;
    }
    body {
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    a { color: #3895ff; text-decoration: none; }
    button { border: 0; outline: 0; cursor: pointer; font-family: inherit; }
    ul { list-style: none; margin: 0; padding: 0; }

    .container { max-width: 100vw; margin: 0 auto; }
    .account-root-page { }

    .top-header { position: relative; }
    .account-header { z-index: 100; background: #fff; width: 100%; position: fixed; top: 0; }

    .header-signup {
      border: 0; border-bottom: 4px solid;
      flex-direction: row; flex: 1;
      justify-content: space-between; align-items: center;
      padding: 8px 12px; display: flex;
      color: #f56a76;
      border-image: linear-gradient(90deg, #e96b6a, rgba(253,92,92,0.55)) 1;
      box-shadow: 0 15px 20px -20px #e96b6a;
    }
    .header-signup img { height: 45px; display: block; }
    .header-signup h2 { font-size: 26px; font-weight: 400; margin: 0; line-height: 1.2; }
    .header-more { position: absolute; top: 50%; right: 15px; transform: translateY(-50%); }

    .account-content {
      padding-top: 80px;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    .account-signup-page {
      max-width: 440px; margin-left: auto; margin-right: auto; padding: 30px 20px;
    }
    .account-signup-page h3 { color: #444; margin-bottom: 1.5em; font-size: 1.5em; font-weight: 400; }

    .signin-signon { }
    .input-field {
      text-align: left; flex-flow: column-reverse; display: flex;
      position: relative; overflow: hidden;
    }
    .input-field label { color: #bababa; touch-action: manipulation; transition: all .2s; font-size: 12px; }
    .input-field input {
      color: #686868; -webkit-tap-highlight-color: transparent;
      border: none; border-bottom: 1px solid #ccc; border-radius: 0; outline: none;
      width: 100%; height: 38px; margin: 20px 0; padding: 8px 0;
      font-size: 18px; line-height: 38px;
      touch-action: manipulation; transition: all .2s;
      font-family: inherit;
    }
    .input-field input:focus { border-bottom: 1px solid #3895ff; }
    .input-field input:placeholder-shown + label {
      transform-origin: 0 100%; pointer-events: none;
      transform: translateY(30px) scale(1.4);
    }
    .input-field input:not(:placeholder-shown) + label,
    .input-field input:focus + label { cursor: pointer; transform: translate(0) scale(1); }
    .input-field ::placeholder { opacity: 0; color: #bababa; transition: inherit; }
    .icons-on-input {
      display: flex; position: absolute; bottom: 50%; right: 0; transform: translateY(50%);
    }

    .component-icon {
      background-position: 50%; background-repeat: no-repeat; background-size: contain; display: block;
    }
    .icon-xs { width: 16px; height: 16px; }
    .icon-sm { width: 24px; height: 24px; }

    .password-tip { color: #969696; font-size: 11px; line-height: 16px; margin: 4px 0 0; }

    .infomation-content { color: #969696; margin-top: 20px; font-size: 11px; line-height: 20px; }
    .infomation-content a { color: #3895ff; }

    .submit-button {
      color: #fff; background-color: #3895ff; border: none; border-radius: 4px;
      width: 100%; height: 45px; margin-top: 30px; font-size: 14px;
      text-align: center; cursor: pointer; outline: none; font-weight: 600;
      font-family: inherit;
    }
    .submit-button:disabled { background-color: #e6e6e6; cursor: default; }

    .separate-text { color: #242424; margin: 2em 0 1em; padding: 0 10px; font-size: 1.25em; }

    .yconnect-action button {
      color: #686868; background-color: #fff; border: 1px solid #ccc; border-radius: 3px;
      width: 100%; height: 44px; margin-top: 0; font-size: 14px;
      display: flex; align-items: center; padding: 0 12px; cursor: pointer;
      font-family: inherit; font-weight: 600;
    }
    .yconnect-action button .component-icon {
      background-image: url(https://image.paypay.ne.jp/images/payment-miniapps/common/yahoo.png);
      width: 24px; height: 24px; flex-shrink: 0;
    }
    .yconnect-action button span { flex: 1; text-align: center; }

    .switch-sign-flow {
      color: #3895ff; border-top: 1px solid #f2f2f2;
      margin-top: 60px; padding: 15px 0; font-size: 12px;
    }
    .switch-sign-flow a { color: #3895ff; }
    .switch-sign-flow strong { font-size: 16px; padding-left: 10px; font-weight: 600; }
  </style>
</head>
<body class="ios outside-native account-sign-in">

<div id="app" data-v-app="">
  <div id="app" style="--font-weight-bold: var(--font-weight-bold-ios); --RootPortal-zIndex: 1100;">
    <div class="container">
      <section data-v-32bf0b5d="" class="account-root-page">

        <section data-v-b035e588="" data-v-32bf0b5d="" class="top-header account-header">
          <header data-v-b035e588="" class="header-signup">
            <img data-v-b035e588="" src="https://image.paypay.ne.jp/images/payment-miniapps/opa/logo.png" alt="PayPay" height="45">
            <h2 data-v-b035e588="">新規登録</h2>
          </header>
          <div data-v-b035e588="" class="header-more"></div>
        </section>

        <div data-v-32bf0b5d="" class="account-content">
          <section data-v-796fd186="" data-v-32bf0b5d="" class="account-signup-page">
            <h3 data-v-796fd186="">PayPayの利用には新規登録が必要です</h3>

            <section data-v-6ea1e05b="" data-v-796fd186="" class="signin-signon">
              <div data-v-6ea1e05b="" class="username">
                <div data-v-6ea1e05b="" class="input-field">
                  <div data-v-6ea1e05b="" class="icons-on-input" style="display: none;"></div>
                  <input data-v-6ea1e05b="" type="tel" name="username" placeholder="携帯電話番号" maxlength="13" value="" autocomplete="off">
                  <label data-v-6ea1e05b="" id="login-inputPhone-txt" for="username">携帯電話番号</label>
                </div>
              </div>

              <div data-v-6ea1e05b="" class="password">
                <div data-v-6ea1e05b="" class="input-field">
                  <div data-v-6ea1e05b="" class="icons-on-input" style="display: none;"></div>
                  <input data-v-6ea1e05b="" type="password" name="password" placeholder="パスワード" class="password-input" autocomplete="new-password">
                  <label data-v-6ea1e05b="" id="login-inputPassword-txt" for="password">パスワード</label>
                </div>
                <p data-v-6ea1e05b="" class="password-tip">半角英大文字・英小文字・数字を含む６〜３２文字（記号可）</p>
              </div>

              <div data-v-796fd186="" class="infomation-content">
                <a data-v-796fd186="" href="https://about.paypay.ne.jp/terms/" target="_blank">PayPay利用規約</a>、
                <a data-v-796fd186="" href="https://about.paypay.ne.jp/terms/consumer/legal/money-light/" target="_blank">PayPayマネーライト資金決済法表示</a>、<br data-v-796fd186="">
                <a data-v-796fd186="" href="https://about.paypay.ne.jp/terms/consumer/legal/money/" target="_blank">PayPayマネー資金決済法表示</a>、
                <a data-v-796fd186="" href="https://about.paypay.ne.jp/docs/terms/privacy/" target="_blank">プライバシーポリシー</a>
              </div>

              <button data-v-6ea1e05b="" id="login-loginBtn" class="submit-button" disabled="">上記に同意して新規登録</button>
            </section>

            <div data-v-796fd186="" class="separate-text">外部のアカウントで新規登録</div>

            <section data-v-cbe44f2d="" data-v-796fd186="" class="yconnect-action">
              <button data-v-cbe44f2d="" class="vm">
                <i data-v-3c7781bb="" data-v-cbe44f2d="" class="component-icon icon-yahoo icon-sm ib vm"></i>
                <span data-v-cbe44f2d="" class="pl10">Yahoo! JAPAN ID</span>
              </button>
            </section>

            <div data-v-796fd186="" class="switch-sign-flow">
              すでにアカウントをお持ちの場合
              <a data-v-796fd186="" href="signin.html">
                <strong data-v-796fd186="" class="fs16 pl10">ログイン</strong>
              </a>
            </div>
          </section>
        </div>

      </section>
    </div>
  </div>
</div>

</body>
</html>
